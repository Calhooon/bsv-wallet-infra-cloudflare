name = "wallet-infra"
main = "build/worker/shim.mjs"
compatibility_date = "2024-01-01"
account_id = "<your-account-id>"

routes = [
  { pattern = "wallet-infra.x402agency.com", custom_domain = true }
]

[vars]
# BUG-005 FIX (2026-04-12): switched from api.calhouninfra.com (old TS
# chaintracks, intermittently returns 200-success with empty value for
# recent heights) to the new rust-chaintracks CF Worker, which has
# better reliability and correctly serves findHeaderHexForHeight.
# btc-relay #56 fix 15: MUST be the custom domain — same-account
# worker-to-worker fetches to *.workers.dev are blocked by Cloudflare
# (error 1042 class; the monitor's currentHeight was failing and silently
# falling back to WoC). Verified live: /currentHeight answers on the domain.
CHAINTRACKS_URL = "https://chaintracks.calhouninfra.com"
BEEF_VERIFICATION = "strict"
# ZERO-CONF dev lever (2026-06-08): keep a freshly-internalized deposit spendable
# even if the internalize-time broadcast hits a transient ServiceError, removing the
# ~1-block (~10 min) wait for the monitor to reconcile spendable. Safe for the dev
# setup (operator funds from their own already-broadcast wallet, so the funding tx is
# genuinely on-network; a true DoubleSpend/InvalidTx still hard-rejects upstream). The
# monitor still fetches the proof + completes status normally. Set to "false" to
# restore the conservative confirmation-gated behavior.
INTERNALIZE_ZERO_CONF = "true"
# BROADCASTER selects the broadcast provider (2026-07-13 Arcade V2 migration):
#   unset / "arc"  = the pre-migration ARC→WoC MultiProvider path (no-regression default)
#   "arcade"       = Arcade V2 primary (EF-only, async SSE verdict gated on
#                    SEEN_ON_NETWORK); ARC/WoC fall back ONLY on an Arcade OUTAGE —
#                    never on a REJECTED verdict. Any other value = hard STOP
#                    (visible in GET / health as "broadcaster").
# ARCADE_URL overrides the Arcade endpoint (default https://arcade-v2-us-1.bsvblockchain.tech).
# ROLLBACK LEVER: flip this line back to "arc" + `npx wrangler deploy` (~60s; verify via
# GET / "broadcaster"). NOTE `wrangler secret put BROADCASTER` does NOT work — a secret
# cannot shadow a [vars] entry (staging drill 2026-07-13). Allow ~1 min after deploy for
# old isolates to drain before reading gate checks.
BROADCASTER = "arcade"
# Webhook proof delivery (push-native merkle proofs): every Arcade submit registers
# X-CallbackUrl so Arcade POSTs status (+ the free MINED merklePath) to /arcade/callback,
# Bearer-authed with the ARCADE_CALLBACK_TOKEN secret (`wrangler secret put`). BOTH must
# be set for registration; the proof is still ChainTracks-verified before persisting, and
# the cron monitor remains the fallback. Unset either to disable (SSE-verdict-only).
ARCADE_CALLBACK_URL = "https://wallet-infra.x402agency.com/arcade/callback"

[build]
# Self-pinning (the worker-build pairing trap, see the-composer
# docs/ARCHITECTURE.md): this crate is on worker 0.8.x, which needs
# worker-build ^0.8 — a stale 0.7.x install bricks the build with
# "Unsupported version worker@0.8".
command = "cargo install -q --version ^0.8 worker-build && worker-build --release"

[[d1_databases]]
binding = "DB"
database_name = "wallet-infra"
database_id = "<your-d1-database-id>"

[[r2_buckets]]
binding = "BLOBS"
bucket_name = "wallet-infra-blobs"

[[kv_namespaces]]
binding = "AUTH_SESSIONS"
id = "<your-account-id>"

[triggers]
# 2026-04-15: reverted */2 → */5 after WoC blanket-429'd us. The */2 cadence
# combined with 5 retries and LIMIT 1000 hammered WoC into rate-limiting.
# */5 + LIMIT 200 + 1 retry is the conservative recovery configuration.
crons = ["*/5 * * * *"]
