# Shared Worker gate: PR head, read-only token, pinned Rust, cached cargo; also called by release.yml on a tag.
# Host clippy covers all targets; wasm clippy covers libraries because SQLite dev tests are native.
name: ci
'on':
  pull_request: null
  workflow_call: null
  push:
    branches:
    - main
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
      with:
        toolchain: 1.95.0
        components: rustfmt, clippy
        targets: wasm32-unknown-unknown
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        workspaces: . -> target
    - run: cargo test --no-fail-fast
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
      with:
        toolchain: 1.95.0
        components: rustfmt, clippy
        targets: wasm32-unknown-unknown
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        workspaces: . -> target
    - run: cargo fmt --all -- --check
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
      with:
        toolchain: 1.95.0
        components: rustfmt, clippy
        targets: wasm32-unknown-unknown
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        workspaces: . -> target
    - run: cargo clippy --all-targets -- -D warnings
    - run: cargo clippy --target wasm32-unknown-unknown --lib -- -D warnings
  wasm32:
    name: wasm32
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
      with:
        toolchain: 1.95.0
        components: rustfmt, clippy
        targets: wasm32-unknown-unknown
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        workspaces: . -> target
    - run: cargo install worker-build@0.8.4 --locked
    - run: worker-build --release
  worker:
    name: worker
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
      with:
        toolchain: 1.95.0
        components: rustfmt, clippy
        targets: wasm32-unknown-unknown
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        workspaces: . -> target
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '22'
    - run: cargo install worker-build@0.8.4 --locked
    - run: worker-build --release
    - run: npm install --prefix "$RUNNER_TEMP/worker-gate-node" --no-save --package-lock=false miniflare@4.20260426.0
        @bsv/sdk@3.2.0
    - run: 'export MINIFLARE_MODULE="$RUNNER_TEMP/worker-gate-node/node_modules/miniflare/dist/src/index.js"

        export BSV_SDK_MODULE="$RUNNER_TEMP/worker-gate-node/node_modules/@bsv/sdk/dist/esm/mod.js"

        node tests/worker_beef_at_rest.mjs

        node tests/worker_door_policies.mjs

        node tests/worker_route_fixtures.mjs

        node tests/worker_proof_hold.mjs

        node tests/worker_list_pages.mjs'
  scrub:
    name: scrub
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0
    - name: Scrub the tree and every commit's added lines since the base (since the previous release tag on a tag)
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        REF_TYPE: ${{ github.ref_type }}
      run: |
        base="${BASE_SHA:-}"
        if [ "${REF_TYPE:-}" = tag ]; then
          base=--tag
        elif [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
          base=--all
        fi
        tools/scrub.sh "$base"
